<!doctype html>
<html>
<head><meta charset="utf-8"><title>Apply: Policy Analyst</title>
<style>.trap { position: absolute; left: -9999px; } .field { margin: 8px 0; }</style></head>
<body>
  <h1>Policy Analyst at Example Civic Labs</h1>
  <form method="post" action="/submit" enctype="multipart/form-data">
    <div class="field"><label for="first_name">First Name <span>*</span></label><input id="first_name" name="first_name" required></div>
    <div class="field"><label for="last_name">Last Name <span>*</span></label><input id="last_name" name="last_name" required></div>
    <div class="field"><label for="email">Email <span>*</span></label><input id="email" name="email" type="email" required></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
    <div class="field"><label for="resume">Resume/CV <span>*</span></label><input id="resume" name="resume" type="file" required></div>
    <div class="field"><label for="cover">Cover Letter</label><input id="cover" name="cover" type="file"></div>
    <div class="field"><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin"></div>
    <div class="field trap"><label for="website_hp">Leave this empty</label><input id="website_hp" name="website_hp" tabindex="-1"></div>
    <div class="field"><label for="auth">Are you legally authorized to work in the United States? *</label>
      <select id="auth" name="auth" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
    <fieldset class="field"><legend>Will you now or in the future require visa sponsorship? *</legend>
      <label><input type="radio" name="sponsor" value="yes" required> Yes</label>
      <label><input type="radio" name="sponsor" value="no"> No</label></fieldset>
    <div class="field"><label for="why">Why are you interested in this role? *</label><textarea id="why" name="why" required></textarea></div>
    <div class="field"><label for="gender">Gender</label>
      <select id="gender" name="gender"><option value="">Select...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div>
    <div class="field"><label><input type="checkbox" name="privacy" value="1" required> I agree to the privacy policy *</label></div>
    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
