# What `resumetron interview` produces. Edit freely.
summary: Recent public policy graduate with municipal internship experience, seeking entry-level policy analyst or program coordinator roles in government or civic nonprofits.
targetRoles: [Policy Analyst, Program Coordinator, Legislative Aide]
titleInclude: []
titleExclude: [Senior, Director, Principal, Engineer]
keywords: [policy, research, government, community, program, analysis, briefing, stakeholder]
locations: [Springfield, Chicago, IL]
remoteOk: true
remoteOnly: false
minSalary: 45000
dealbreakers: [unpaid]
companies:
  - { ats: greenhouse, token: examplecivic, name: Example Civic Labs }
  - { ats: lever, token: example-nonprofit, name: Example Nonprofit }
searches:
  - { query: policy analyst, location: Illinois }
blockedCompanies: []
notes: "Lead with policy research, where the thesis and internship are strongest; test legislative staff roles alongside it."
# Optional opening strategy. The first run starts these tracks as written; after that,
# the weekly review revises them. Leave it out and the first run drafts its own.
tracks:
  - name: Municipal policy research
    hypothesis: Entry-level analyst roles in city and county government, where the municipal internship is direct experience.
    roles: [Policy Analyst, Research Analyst]
    queries: [policy analyst, research analyst, budget analyst]
    employers: [City of Chicago]
  - name: Legislative staff
    hypothesis: Legislative aide roles, building on briefing and stakeholder work.
    roles: [Legislative Aide, Legislative Assistant]
    queries: [legislative aide, legislative assistant]
    employers: []
